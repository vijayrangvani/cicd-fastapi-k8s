name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
    
  build-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-fastapi:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-fastapi:latest
  
  deploy:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Deploy the new image version
        run: |
          kubectl set image deployment/cicd-fastapi \
            cicd-fastapi=${{ secrets.DOCKERHUB_USERNAME }}/cicd-fastapi:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/cicd-fastapi --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -o wide
          kubectl port-forward service/cicd-fastapi 8080:80 &
          sleep 5
          echo "Health check response:"
          curl -sf http://localhost:8080/health
          echo ""